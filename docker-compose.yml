services:
  whisperlive:
    image: ghcr.io/collabora/whisperlive-gpu:latest
    command: >
      python run_server.py --port 9090 --backend faster_whisper
      --faster_whisper_custom_model_path ${WHISPER_MODEL:-deepdml/faster-whisper-large-v3-turbo-ct2}
      --batch_inference --max_clients 10 --max_connection_time 14400
      --omp_num_threads 4 --enable_rest --rest_port 8000
    # no published ports: only the hub talks to it, over the meetnet network
    volumes:
      - hf-cache:/root/.cache
    networks: [meetnet]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  caption-hub:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8085:8085"
    environment:
      TRANSCRIBER: whisperlive
      WHISPERLIVE_URL: ws://whisperlive:9090
      WHISPER_MODEL: ${WHISPER_MODEL:-deepdml/faster-whisper-large-v3-turbo-ct2}
      DATA_DIR: /app/data/meetings
      # Ollama already runs on the Docker host; host.docker.internal resolves to it on Docker Desktop and via extra_hosts on Linux
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:9b}
      ODOO_URL: ${ODOO_URL:-}
      ODOO_DB: ${ODOO_DB:-}
      ODOO_USER: ${ODOO_USER:-}
      ODOO_API_KEY: ${ODOO_API_KEY:-}
      ODOO_PROJECT_ID: ${ODOO_PROJECT_ID:-}
    volumes:
      - ./data/meetings:/app/data/meetings
    depends_on: [whisperlive]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [meetnet]
    restart: unless-stopped

volumes:
  hf-cache:

networks:
  meetnet:
